<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#f3f6fa"/>
  <title>恒升 · 基金模拟平台</title>
  <style>
    body{margin:0}
    .initial-boot{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at 32% 30%,#dce8f6,transparent 48%),#f3f6fa;color:#69798c;font:13px "Microsoft YaHei",system-ui,sans-serif}
    .initial-boot__mark{position:relative;display:grid;place-items:center;width:86px;height:86px;color:#24558f;font-size:32px}
    .initial-boot__mark:before{content:"";position:absolute;inset:0;border:1px solid #d7e3f1;border-top-color:#163b69;border-radius:50%;animation:initial-orbit 2s linear infinite}
    @keyframes initial-orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.initial-boot__mark:before{animation:none}}
  </style>
</head>
<body>
  <div id="app"><div class="initial-boot" role="status"><span class="initial-boot__mark" aria-hidden="true">恒</span><span>正在载入基金模拟平台…</span></div></div>
  <noscript>请启用浏览器 JavaScript 以使用基金模拟平台。</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
