# The outer gateway must overwrite forwarding headers and be the only remote entry.
# Keep this web listener loopback-only before enabling FRAMEWORK in the backend.
map $http_x_forwarded_proto $fund_forwarded_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fund_forwarded_scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
